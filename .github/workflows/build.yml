name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: bun install

    - name: Bundle with ncc
      run: |
        npx -y @vercel/ncc build src/index.ts -o dist --target es2022

    - name: Create pkg entry and build exe
      run: |
        echo "require('./index.js')" > dist/entry.js
        npx -y @yao-pkg/pkg dist/entry.js --targets node20-win-x64 --output dist/ts-solver.exe --compress GZip
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ts-solver-${{ matrix.os }}
        path: dist/ts-solver.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/ts-solver.exe
        generate_release_notes: true
